<header class="site-header">
  <div class="container header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Garrett Beck profile home">
      <span class="wordmark-mark" aria-hidden="true">GB</span>
      <span class="wordmark-label">Garrett Beck</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}><span aria-hidden="true">⌂</span> Overview</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}><span aria-hidden="true">◉</span> About</a>
      <a href="{{ '/experience/' | relative_url }}"{% if page.url == '/experience/' %} aria-current="page"{% endif %}><span aria-hidden="true">▤</span> Experience</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}><span aria-hidden="true">✉</span> Contact</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
      <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">☼</span>
      <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">◐</span>
      <span class="theme-toggle-label">Theme</span>
    </button>
  </div>
</header>
